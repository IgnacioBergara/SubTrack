name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, typecheck, tests y build
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: subtrack
          POSTGRES_PASSWORD: subtrack
          POSTGRES_DB: subtrack
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U subtrack"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15

    env:
      DATABASE_URL: postgresql://subtrack:subtrack@localhost:5432/subtrack?schema=public
      TEST_DATABASE_URL: postgresql://subtrack:subtrack@localhost:5432/subtrack?schema=test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npx prisma generate
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - name: Tests unitarios e integración con cobertura
        run: npm run test:coverage
      - run: npm run build

      - name: Publicar reporte de cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
