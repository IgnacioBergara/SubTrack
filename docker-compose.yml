services:
  db:
    image: postgres:17-alpine
    container_name: subtrack-db
    environment:
      POSTGRES_USER: subtrack
      POSTGRES_PASSWORD: subtrack
      POSTGRES_DB: subtrack
    ports:
      - "5432:5432"
    volumes:
      - subtrack-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U subtrack"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  subtrack-db:
